[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oxygen_shape"
version = "0.1.0"
description = "Oxygen diffusion shape optimization: Laplace + Robin membrane flux, finite-volume reference solver."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Nabil ES-SAADI"}]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "scikit-image>=0.21",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pandas>=2.0",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.4"]

[project.scripts]
oxygen-shape = "oxygen_shape.cli:app"

[project.urls]
Repository = "https://github.com/nabil-stem/oxygen-shape-optimization"
Releases = "https://github.com/nabil-stem/oxygen-shape-optimization/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
